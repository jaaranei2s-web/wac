<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#C8102E"><title>Wydad Athlete Manager</title>
<style>
:root{--red:#C8102E;--bg:#f6f4f2;--card:#fff;--ink:#1a1517;--mut:#6b6368;--line:#e7e2e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#120e10;--card:#1e1819;--ink:#f3eeef;--mut:#a39a9e;--line:#352c2f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#120e10;--card:#1e1819;--ink:#f3eeef;--mut:#a39a9e;--line:#352c2f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif;padding-bottom:70px}
h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;margin:0}
header{background:var(--red);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}header h1{font-size:22px;letter-spacing:.3px}header small{opacity:.85}
header button{margin-left:auto;background:transparent;color:#fff;border-color:#fff9}
main{max-width:980px;margin:0 auto;padding:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-width:64px;background:none;border:0;color:var(--mut);padding:12px 6px;font:600 12px 'Barlow Semi Condensed',sans-serif;border-top:3px solid transparent}nav button.on{color:var(--red);border-top-color:var(--red)}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.k b{display:block;font:700 30px 'Barlow Semi Condensed',sans-serif}.k span{color:var(--mut);font-size:13px}.k.r b{color:var(--red)}
button,.btn{font:600 14px Barlow,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 13px;cursor:pointer}.p{background:var(--red);border-color:var(--red);color:#fff}.d{color:var(--red)}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row>div:first-child{flex:1;min-width:0}.m{color:var(--mut);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--red);border-radius:4px 4px 0 0;min-height:2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.st{display:flex;gap:6px}.st button{flex:1;padding:9px 2px;font-size:13px}.act{color:#fff!important;border-color:transparent!important}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}.cal i{font-style:normal;border-radius:5px;padding:5px 0;background:var(--bg);color:var(--mut)}.cal i[style]{color:#fff}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}#md.on{display:flex}
#md>div{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.top>*{flex:0 0 auto}.top input{flex:1;min-width:140px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:20}
@media(prefers-reduced-motion:no-preference){#md>div{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style></head><body>
<header><div><h1>Wydad Athlete Manager</h1><small id="club"></small></div><button id=lo style="display:none" onclick="logout()">Déconnexion</button></header>
<main id="main"></main><nav id="nav"></nav><div id="md"></div><div id="toast"></div>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script>
const MS=['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
const ST={P:['Présent','#1f9d55'],A:['Absent','#C8102E'],L:['Retard','#d97706'],E:['Excusé','#3b82f6']};
const $=s=>document.querySelector(s),V=id=>($('#'+id)||{}).value||'',uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10),ago=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D;try{D=JSON.parse(localStorage.getItem('wam'))}catch(e){}
D=D||{a:[],g:[],c:[],s:[],set:{club:'Wydad Athletic Club',types:['Entraînement','Match','Physique','Tactique'],theme:'auto',lb:0}};D.users=D.users||[];
let tab='home',AS=null,SEL=new Set(),F={q:'',c:'',g:'',s:'',o:'n'},LAST=null,IMP=null,okCb=null;
let ME=null,LR='dir',fails=0,lock=0;
const ec=a=>a.co||gG(a.g)?.coach,isDir=()=>ME&&ME.role=='dir',VA=()=>isDir()?D.a:D.a.filter(a=>ec(a)==ME.coach),VG=()=>isDir()?D.g:D.g.filter(g=>g.coach==ME.coach),sc=s=>!ME||isDir()||gG(s.g)?.coach==ME.coach;
const save=()=>{try{localStorage.setItem('wam',JSON.stringify(D))}catch(e){toast('Stockage local plein')}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#md').innerHTML='<div>'+h+'</div>';$('#md').classList.add('on')}
function closeM(){$('#md').classList.remove('on');$('#md').innerHTML=''}
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};
function ask(msg,cb,btn='Confirmer'){okCb=cb;modal(`<h3>${msg}</h3><div class=top style="margin-top:14px"><button class="p" onclick="closeM();okCb()">${btn}</button><button onclick="closeM()">Annuler</button></div>`)}
const gA=i=>D.a.find(a=>a.i==i),gG=i=>D.g.find(g=>g.i==i),gn=i=>(gG(i)||{n:'—'}).n,cn=i=>(D.c.find(c=>c.i==i)||{n:'—'}).n;
const age=d=>d?Math.floor((Date.now()-new Date(d))/31557600000):'—';
function stats(id,f='0000',t='9999'){const r={t:0,P:0,A:0,L:0,E:0};D.s.forEach(s=>{const v=s.rec[id];if(v&&s.date>=f&&s.date<=t){r.t++;r[v]++}});r.rate=r.t?Math.round((r.P+r.L)/r.t*100):0;return r}
function agg(fn,f='0000',t='9999'){let n=0,k=0;D.s.forEach(s=>{if(sc(s)&&fn(s)&&s.date>=f&&s.date<=t)Object.values(s.rec).forEach(v=>{n++;if(v=='P'||v=='L')k++})});return n?Math.round(k/n*100):0}
const bars=d=>`<div class=bars>${d.map(x=>`<div><i style="height:${x.v}px"></i>${x.l}<br><b>${x.t??x.v+'%'}</b></div>`).join('')}</div>`;
const bar=v=>`<div class=bar><i style="width:${v}%"></i></div>`;
const k=(l,v,r)=>`<div class="card k ${r?'r':''}"><b>${v}</b><span>${l}</span></div>`;
function render(){D.set.theme!='auto'?document.documentElement.dataset.theme=D.set.theme:delete document.documentElement.dataset.theme;
$('#club').textContent=D.set.club;$('#lo').style.display=ME?'block':'none';if(!ME){$('#nav').innerHTML='';$('#main').innerHTML=loginView();return}if(!isDir()&&(tab=='grp'||tab=='set'))tab='home';const T0=[['home','Accueil'],['ath','Athlètes'],['grp','Groupes'],['att','Pointage'],['sta','Stats'],['rep','Rapports'],['set','Réglages']],T=isDir()?T0:T0.filter(t=>t[0]!='grp'&&t[0]!='set');
$('#nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');$('#main').innerHTML=views[tab]()}
const empty=`<div class=card><h3>Aucune donnée pour l’instant</h3><p class=m>Ajoutez un groupe puis des athlètes, ou chargez des données de test pour explorer l’application.</p><button class="p" onclick="demo()">Charger des données de test</button></div>`;
const views={
home(){const t=today(),ts=D.s.filter(s=>s.date==t&&sc(s));let p=0,a=0,l=0;ts.forEach(s=>Object.values(s.rec).forEach(v=>v=='P'?p++:v=='A'?a++:v=='L'?l++:0));
const wk=[5,4,3,2,1,0].map(i=>({l:'S-'+i,v:agg(()=>1,ago(i*7+6),ago(i*7))}));const rc=D.s.filter(sc).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,5);
const rem=isDir()&&Date.now()-D.set.lb>12096e5&&D.a.length?`<div class=card style="border-color:var(--red)">Aucune sauvegarde depuis plus de 14 jours. <button onclick="tab='set';render()">Sauvegarder</button></div>`:'';
return rem+(D.a.length?'':empty)+`<div class=g>${k('Athlètes inscrits',VA().length)}${k('Présents aujourd’hui',p)}${k('Absents',a)}${k('Retards',l)}${k('Taux de présence',agg(()=>1)+'%',1)}${k('Séances',D.s.filter(sc).length)}${k('Taux 7 jours',agg(()=>1,ago(7))+'%')}${k('Taux 30 jours',agg(()=>1,ago(30))+'%')}</div>
<div class=card><h3>Tendance hebdomadaire</h3>${bars(wk)}</div>
<div class=card><h3>Actions rapides</h3><div class=top style="margin-top:8px"><button class=p onclick="tab='att';AS=null;render()">Nouveau pointage</button><button onclick="tab='ath';render();athForm()">Ajouter un athlète</button><button onclick="tab='ath';render()">Voir les athlètes</button><button onclick="tab='rep';render()">Générer des rapports</button></div></div>
<div class=card><h3>Derniers pointages</h3>${rc.map(s=>{const n=Object.keys(s.rec).length,p=Object.values(s.rec).filter(v=>v=='P'||v=='L').length;return`<div class=row onclick="AS='${s.i}';tab='att';render()"><div><b>${esc(gn(s.g))}</b> <span class=m>${s.date} · ${esc(s.type)}</span></div><b>${n?Math.round(p/n*100):0}%</b></div>`}).join('')||'<p class=m>Aucun pointage enregistré.</p>'}</div>`},
ath(){let L=VA().filter(a=>(!F.q||(a.n+a.id).toLowerCase().includes(F.q.toLowerCase()))&&(!F.c||a.c==F.c)&&(!F.g||a.g==F.g)&&(!F.s||a.st==F.s)&&(!F.co||ec(a)==F.co));
L.sort((x,y)=>F.o=='r'?stats(y.i).rate-stats(x.i).rate:x.n.localeCompare(y.n));const cats=[...new Set(D.a.map(a=>a.c).filter(Boolean))];
return `<div class=top><input id=sq placeholder="Rechercher un nom ou un ID" value="${esc(F.q)}" oninput="F.q=this.value;keep('ath')"><button class=p onclick="athForm()">Ajouter</button></div>
<div class=top><select onchange="F.c=this.value;render()"><option value="">Catégorie</option>${cats.map(c=>`<option ${F.c==c?'selected':''}>${esc(c)}</option>`)}</select>
<select onchange="F.g=this.value;render()"><option value="">Groupe</option>${VG().map(g=>`<option value="${g.i}" ${F.g==g.i?'selected':''}>${esc(g.n)}</option>`)}</select>
<select onchange="F.co=this.value;render()"><option value="">Entraîneur</option>${D.c.map(c=>`<option value="${c.i}" ${F.co==c.i?'selected':''}>${esc(c.n)}</option>`)}</select>
<select onchange="F.s=this.value;render()"><option value="">Statut</option><option value=A ${F.s=='A'?'selected':''}>Actif</option><option value=I ${F.s=='I'?'selected':''}>Inactif</option></select>
<select onchange="F.o=this.value;render()"><option value=n>Tri : nom</option><option value=r ${F.o=='r'?'selected':''}>Tri : présence</option></select></div>
<div class=card>${L.map(a=>{const s=stats(a.i);return`<div class=row onclick="prof('${a.i}')"><div><b>${esc(a.n)}</b> ${a.st=='I'?'<span class=tag>Inactif</span>':''}<div class=m>${esc(a.id)} · ${esc(a.c||'—')} · ${esc(gn(a.g))}</div></div><div style="width:70px;text-align:right"><b>${s.rate}%</b>${bar(s.rate)}</div></div>`}).join('')||(D.a.length?'<p class=m>Aucun athlète ne correspond aux filtres.</p>':empty)}</div>`},
grp(){return `<div class=top><button class=p onclick="grpForm()">Créer un groupe</button><button onclick="cohForm()">Ajouter un entraîneur</button></div>`+(D.g.length?'':'<p class=m>Créez votre premier groupe pour y affecter des athlètes.</p>')+D.g.map(g=>{const m=D.a.filter(a=>a.g==g.i);return`<div class=card><div class=row><div><h3>${esc(g.n)}</h3><span class=m>${m.length} athlètes · taux ${agg(s=>s.g==g.i)}%</span></div><button onclick="grpForm('${g.i}')">Modifier</button><button class=d onclick="ask('Supprimer le groupe ? Les athlètes seront détachés, l’historique est conservé.',()=>{D.a.forEach(a=>{if(a.g=='${g.i}')a.g=''});D.g=D.g.filter(x=>x.i!='${g.i}');save();render()},'Supprimer')">Supprimer</button></div>
<label>Entraîneur</label><select onchange="gG('${g.i}').coach=this.value;save();render()"><option value="">—</option>${D.c.map(c=>`<option value="${c.i}" ${g.coach==c.i?'selected':''}>${esc(c.n)}</option>`)}</select><div class=m style="margin-top:8px">${m.map(a=>esc(a.n)).join(', ')||'Aucun athlète'}</div></div>`}).join('')+(D.c.length?`<div class=card><h3>Entraîneurs</h3>${D.c.map(c=>`<div class=row><div>${esc(c.n)} <span class=m>${D.a.filter(a=>ec(a)==c.i).length} joueurs</span></div><button class=d onclick="ask('Retirer cet entraîneur ?',()=>{D.g.forEach(g=>{if(g.coach=='${c.i}')g.coach=''});D.c=D.c.filter(x=>x.i!='${c.i}');save();render()},'Retirer')">Retirer</button></div>`).join('')}</div>`:'')},
att(){const s=D.s.find(x=>x.i==AS);if(!s)return`<div class=card><h3>Nouvelle séance</h3><label>Groupe</label><select id=ag onchange="$('#ac').value=gG(this.value)?.coach||''">${VG().map(g=>`<option value="${g.i}">${esc(g.n)}</option>`)}</select><label>Entraîneur</label><select id=ac>${D.c.map(c=>`<option value="${c.i}" ${ME.coach==c.i?'selected':''}>${esc(c.n)}</option>`)}<option value="">—</option></select><label>Date</label><input id=ad type=date value="${today()}"><label>Type</label><select id=at>${D.set.types.map(t=>`<option>${esc(t)}</option>`)}</select><label>Description (facultatif)</label><input id=adx><div class=top style="margin-top:12px"><button class=p onclick="startSes()">Démarrer le pointage</button></div></div>`+(D.s.length?`<div class=card><h3>Séances passées</h3>${D.s.filter(sc).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,30).map(s=>`<div class=row onclick="AS='${s.i}';render()"><div><b>${esc(gn(s.g))}</b><div class=m>${s.date} · ${esc(s.type)}</div></div><span class=m>Ouvrir</span></div>`).join('')}</div>`:'');
const ids=[...new Set([...D.a.filter(a=>a.g==s.g&&a.st!='I').map(a=>a.i),...Object.keys(s.rec)])].map(gA).filter(Boolean);const n=Object.keys(s.rec).length,p=Object.values(s.rec).filter(v=>v=='P'||v=='L').length;
return `<div class=card><div class=row><div><h3>${esc(gn(s.g))}</h3><span class=m>${s.date} · ${esc(s.type)} · ${esc(cn(s.coach))}${s.desc?' · '+esc(s.desc):''}</span></div><button onclick="AS=null;render()">Fermer</button></div>
<div class=g><div class=k><b>${p}/${ids.length}</b><span>Présents (retards inclus)</span></div><div class=k><b>${ids.length?Math.round(p/ids.length*100):0}%</b><span>Taux de la séance</span></div></div>
<div class=top style="margin-top:10px"><button class=p onclick="markAll('${s.i}')">Tout le monde présent</button><button onclick="hist('${s.i}')">Historique des modifications</button></div></div>
<div class=card>${ids.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(a.n)}</b><div class=st style="margin-top:5px">${Object.keys(ST).map(c=>`<button class="${s.rec[a.i]==c?'act':''}" ${s.rec[a.i]==c?`style="background:${ST[c][1]}"`:''} onclick="mark('${s.i}','${a.i}','${c}')">${ST[c][0]}</button>`).join('')}</div></div>`).join('')||'<p class=m>Aucun athlète dans ce groupe.</p>'}</div>`},
sta(){const A=VA().map(a=>({a,...stats(a.i)})).filter(x=>x.t),mo={};D.s.forEach(s=>{const m=s.date.slice(0,7);(mo[m]=mo[m]||[]).push(s)});
const ms=Object.keys(mo).sort().slice(-6).map(m=>({l:MS[+m.slice(5)-1],v:agg(s=>s.date.slice(0,7)==m)}));
const dec=VA().map(a=>({a,n:stats(a.i,ago(30)),o:stats(a.i,ago(60),ago(31))})).filter(x=>x.n.t>=2&&x.o.t>=2&&x.o.rate-x.n.rate>=10);
const lst=(l,f)=>l.map(x=>`<div class=row><div>${esc(x.a.n)}</div><b>${f(x)}</b></div>`).join('')||'<p class=m>Pas encore de données.</p>';
return (D.s.length?'':empty)+`<div class=card><h3>Tendance mensuelle</h3>${bars(ms)}</div>
<div class=card><h3>Comparaison des groupes</h3>${VG().map(g=>`<div class=row><div>${esc(g.n)}${bar(agg(s=>s.g==g.i))}</div><b>${agg(s=>s.g==g.i)}%</b></div>`).join('')||'<p class=m>Aucun groupe.</p>'}</div>
<div class=card><h3>Taux par entraîneur</h3>${(isDir()?D.c:D.c.filter(c=>c.i==ME.coach)).map(c=>`<div class=row><div>${esc(c.n)}${bar(agg(s=>s.coach==c.i))}</div><b>${agg(s=>s.coach==c.i)}%</b></div>`).join('')||'<p class=m>Aucun entraîneur.</p>'}</div>
<div class=card><h3>Classement des absences</h3>${lst([...A].sort((x,y)=>y.A-x.A).slice(0,8),x=>x.A+' abs.')}</div>
<div class=card><h3>Athlètes les plus réguliers</h3>${lst([...A].sort((x,y)=>y.rate-x.rate).slice(0,5),x=>x.rate+'%')}</div>
<div class=card><h3>Présence en baisse (30 derniers jours)</h3>${lst(dec,x=>x.o.rate+'% → '+x.n.rate+'%')}</div>
<div class=card><h3>Séances</h3><p class=m>${D.s.length} séances · ${[...new Set(D.s.map(s=>s.type))].map(t=>t+' : '+D.s.filter(s=>s.type==t).length).join(' · ')||'—'}</p></div>`},
rep(){return `<div class=card><h3>Période du rapport</h3>${perUI()}</div><div class=card><h3>Athlètes</h3><div class=top><button onclick="SEL=new Set(VA().map(a=>a.i));render()">Tous</button><button onclick="SEL=new Set();render()">Aucun</button><select onchange="selG(this.value)"><option value="">Sélectionner un groupe</option>${VG().map(g=>`<option value="${g.i}">${esc(g.n)}</option>`)}</select></div>
${VA().map(a=>`<label class=row style="margin:0;color:var(--ink)"><input type=checkbox style="width:auto" ${SEL.has(a.i)?'checked':''} onchange="this.checked?SEL.add('${a.i}'):SEL.delete('${a.i}')"><div>${esc(a.n)} <span class=m>${esc(a.id)} · ${esc(gn(a.g))}</span></div></label>`).join('')||'<p class=m>Ajoutez des athlètes pour générer des rapports.</p>'}
<div class=top style="margin-top:12px"><button onclick="bulk(1)">Aperçu du premier</button><button class=p onclick="bulk()">Générer (PDF ou ZIP)</button></div><p class=m>Un PDF distinct par athlète ; plusieurs athlètes sont regroupés dans une archive ZIP.</p></div>`},
set(){return `${usersCard()}<div class=card><h3>Identité du club</h3><label>Nom du club (en-tête des rapports)</label><input id=sn value="${esc(D.set.club)}"><label>Types de séance (séparés par des virgules)</label><input id=st value="${esc(D.set.types.join(', '))}"><label>Thème</label><select id=sth><option value=auto>Automatique</option><option value=light ${D.set.theme=='light'?'selected':''}>Clair</option><option value=dark ${D.set.theme=='dark'?'selected':''}>Sombre</option></select><div class=top style="margin-top:10px"><button class=p onclick="D.set.club=V('sn')||D.set.club;D.set.types=V('st').split(',').map(x=>x.trim()).filter(Boolean);D.set.theme=V('sth');save();render();toast('Réglages enregistrés')">Enregistrer</button></div></div>
<div class=card><h3>Sauvegarde et restauration</h3><div class=top><button class=p onclick="backup()">Exporter une sauvegarde</button><label class=btn style="margin:0">Restaurer<input type=file accept=".json" hidden onchange="restore(this.files[0])"></label></div></div>

function impMap(){const m={};FL.forEach(f=>{const e=$('#im_'+f[0]);m[f[0]]=e?+e.value:IMP.m[f[0]]});IMP.m=m;return m}
function impGo(){const m=impMap();if(m.n<0)return toast('Associez la colonne du nom');let n=0;IMP.r.forEach(r=>{const g=k=>m[k]>=0?r[m[k]]:'',nm=String(g('n')).trim(),id=String(g('id')).trim();if(!nm||D.a.some(a=>a.n.toLowerCase()==nm.toLowerCase()||(id&&a.id==id)))return;let dob=g('dob');if(typeof dob=='number')dob=new Date(Math.round((dob-25569)*864e5)).toISOString().slice(0,10);let gi='';const gname=String(g('g')).trim();if(gname){let G=D.g.find(x=>x.n.toLowerCase()==gname.toLowerCase());if(!G){G={i:uid(),n:gname,coach:''};D.g.push(G)}gi=G.i}
D.a.push({i:uid(),reg:today(),n:nm,id:id||'WAC-'+String(D.a.length+1).padStart(3,'0'),dob:String(dob||''),c:String(g('c')),p:String(g('p')),g:gi,ph:String(g('ph')),nt:'',med:'',st:'A'});n++});IMP=null;save();closeM();render();toast(n+' athlètes importés')}
function backup(){D.set.lb=Date.now();save();saveFile('sauvegarde_wydad_'+today()+'.json',JSON.stringify(D))}
async function restore(f){if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.a)||!Array.isArray(o.s))throw Error('fichier invalide');ask('Remplacer toutes les données actuelles par cette sauvegarde ?',()=>{D=o;D.users=D.users||[];save();logout();toast('Sauvegarde restaurée')},'Restaurer')}catch(e){toast('Sauvegarde illisible : '+e.message)}}
function demo(){let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;const c1={i:uid(),n:'Karim Benali'},c2={i:uid(),n:'Youssef Alaoui'},g1={i:uid(),n:'U17',coach:c1.i},g2={i:uid(),n:'U19',coach:c2.i};D.c.push(c1,c2);D.g.push(g1,g2);
const N=['Amine Tazi','Omar Idrissi','Hamza Berrada','Yassine Lahlou','Adam Chraibi','Mehdi Fassi','Zakaria Naciri','Ilyas Kettani','Anas Bennani','Reda Squalli','Walid Mansouri','Soufiane Alami'];
N.forEach((n,k)=>D.a.push({i:uid(),id:'WAC-D'+String(k+1).padStart(2,'0'),n,dob:(2008-k%3)+'-0'+(k%9+1)+'-15',c:k<6?'U17':'U19',p:['Gardien','Défenseur','Milieu','Attaquant'][k%4],g:k<6?g1.i:g2.i,ph:'',nt:'',med:'',st:'A',reg:ago(200)}));
[g1,g2].forEach(g=>{const m=D.a.filter(a=>a.g==g.i);for(let w=9;w>=0;w--)[1,3].forEach(o=>{const s={i:uid(),g:g.i,coach:g.coach,date:ago(w*7+o),type:o==1?'Entraînement':'Tactique',desc:'',rec:{},log:[]};m.forEach(a=>{const r=rnd(),bias=a.id.endsWith('3')||a.id.endsWith('9')?.3:0;s.rec[a.i]=r<.68-bias?'P':r<.78-bias?'L':r<.88-bias?'E':'A'});D.s.push(s)})});save();render();toast('Données de test chargées')}
async function hash(p,s){if(!(window.crypto&&crypto.subtle))return btoa(unescape(encodeURIComponent(s+p)));const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function loginView(){const box='<div class=card style="max-width:420px;margin:30px auto">';if(!D.users.length)return box+`<h2>Première utilisation</h2><p class=m>Créez le compte du directeur. Il créera ensuite les comptes des entraîneurs.</p><label>Nom</label><input id=ln><label>Mot de passe (6 caractères minimum)</label><input id=lp type=password><label>Confirmer</label><input id=lp2 type=password><div class=top style="margin-top:12px"><button class=p onclick="setupDir()">Créer le compte directeur</button></div></div>`;
const L=D.users.filter(u=>u.role==LR),b=r=>`<button class="${LR==r?'act':''}" ${LR==r?'style="background:var(--red)"':''} onclick="LR='${r}';render()">${r=='dir'?'Directeur':'Entraîneur'}</button>`;
return box+`<h2>Connexion</h2><div class=st style="margin:10px 0">${b('dir')}${b('coach')}</div>`+(L.length?`<label>Compte</label><select id=lu>${L.map(u=>`<option value="${u.i}">${esc(u.n)}</option>`).join('')}</select><label>Mot de passe</label><input id=lp type=password onkeydown="if(event.key=='Enter')login()"><div class=top style="margin-top:12px"><button class=p onclick="login()">Se connecter</button></div>`:`<p class=m>Aucun compte entraîneur pour l’instant. Le directeur peut en créer dans Réglages.</p>`)+'</div>'}
async function setupDir(){const n=V('ln').trim(),p=V('lp');if(!n)return toast('Le nom est obligatoire');if(p.length<6)return toast('6 caractères minimum');if(p!=V('lp2'))return toast('Les mots de passe diffèrent');const s=uid();ME={i:uid(),n,role:'dir',coach:'',s,h:await hash(p,s)};D.users.push(ME);save();tab='home';render()}
async function login(){if(Date.now()<lock)return toast('Trop d’essais : patientez quelques secondes');const u=D.users.find(x=>x.i==V('lu'));if(!u)return;if(await hash(V('lp'),u.s)==u.h){ME=u;fails=0;tab='home';render()}else{if(++fails>=5){lock=Date.now()+3e4;fails=0}toast('Mot de passe incorrect')}}
function logout(){ME=null;try{sessionStorage.removeItem('wams')}catch(e){}tab='home';render()}
function usersCard(){return `<div class=card><h3>Comptes de connexion</h3>${D.users.map(u=>`<div class=row><div><b>${esc(u.n)}</b> <span class=tag>${u.role=='dir'?'Directeur':'Entraîneur'}</span></div><button onclick="pwForm('${u.i}')">Mot de passe</button>${u.i!=ME.i?`<button class=d onclick="ask('Supprimer ce compte ?',()=>{D.users=D.users.filter(x=>x.i!='${u.i}');save();render()},'Supprimer')">Supprimer</button>`:''}</div>`).join('')}<div class=top style="margin-top:10px"><button class=p onclick="userForm()">Créer un compte entraîneur</button></div><p class=m>Les comptes sont stockés sur cet appareil. Ils limitent l’accès dans l’application mais ne remplacent pas un serveur sécurisé.</p></div>`}
function userForm(){modal(`<h3>Nouveau compte entraîneur</h3>${D.c.length?`<label>Entraîneur</label><select id=uc>${D.c.map(c=>`<option value="${c.i}">${esc(c.n)}</option>`).join('')}</select><label>Mot de passe (6 caractères minimum)</label><input id=up type=password><div class=top style="margin-top:12px"><button class=p onclick="createUser()">Créer le compte</button><button onclick="closeM()">Annuler</button></div>`:`<p class=m>Ajoutez d’abord un entraîneur dans Groupes, puis revenez ici.</p><button onclick="closeM()">Fermer</button>`}`)}
async function createUser(){const c=V('uc'),p=V('up');if(p.length<6)return toast('6 caractères minimum');if(D.users.some(u=>u.coach==c))return toast('Cet entraîneur a déjà un compte');const s=uid();D.users.push({i:uid(),n:cn(c),role:'coach',coach:c,s,h:await hash(p,s)});save();closeM();render();toast('Compte créé')}
function pwForm(id){modal(`<h3>Nouveau mot de passe</h3><input id=np type=password placeholder="6 caractères minimum"><div class=top style="margin-top:12px"><button class=p onclick="setPw('${id}')">Enregistrer</button><button onclick="closeM()">Annuler</button></div>`)}
async function setPw(id){const u=D.users.find(x=>x.i==id),p=V('np');if(p.length<6)return toast('6 caractères minimum');u.s=uid();u.h=await hash(p,u.s);save();closeM();toast('Mot de passe modifié')}
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if(window.caches)caches.keys().then(k=>k.forEach(x=>caches.delete(x)));
render();
</script></body></html>
