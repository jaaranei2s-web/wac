name: Build WAC Manager APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      live_url:
        description: "Optional: load the live website instead of bundled files (e.g. https://idyllic-monstera-d1f6a4.netlify.app). Leave empty to bundle ./www."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: ${{ github.event.inputs.live_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files for Android
        run: |
          if [ -n "$CAP_SERVER_URL" ] && [ ! -f www/index.html ]; then
            echo '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > www/index.html
          else
            node scripts/prepare-web.js
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Android manifest tweaks
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # Only permission needed: INTERNET (already included by Capacitor). Nothing else is added.
          # Keep keyboard from covering inputs:
          grep -q 'windowSoftInputMode' $M || sed -i 's/<activity /<activity android:windowSoftInputMode="adjustResize" /' $M
          # Lock to portrait+landscape sensor mode, keep Galaxy S23 happy
          grep -q 'screenOrientation' $M || sed -i 's/<activity /<activity android:screenOrientation="unspecified" /' $M

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WAC-Manager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAC-Manager-APK
          path: WAC-Manager.apk
          retention-days: 30
